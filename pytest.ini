[pytest]
markers =
    integration: exercises a real external service (e.g. a live local Ollama server); skipped by default, run explicitly with `-m integration`.
    gpu: requires a local GPU and ComfyUI; skipped by default.
    requires_models: requires heavyweight model downloads (multi-GB); skipped by default, run with `-m requires_models`.
addopts = -m "not integration and not gpu and not requires_models"
pythonpath = modules .

